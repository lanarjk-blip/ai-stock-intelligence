import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

def appConfig = new JsonSlurper().parse(file('../../config.json'))
def appVersion = appConfig.mobile_ui_version.toString()
def versionParts = appVersion.tokenize('.').collect { it as int }
def appVersionCode = (versionParts[0] * 1000000) + (versionParts[1] * 1000) + versionParts[2]

android {
    namespace 'id.asi.stockintelligence'
    compileSdk 35

    defaultConfig {
        applicationId 'id.asi.stockintelligence'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

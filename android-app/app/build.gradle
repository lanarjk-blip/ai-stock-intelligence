import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

def appConfig = new JsonSlurper().parse(file('../../config.json'))
// R85: Android build version is explicit so APK artifacts can prove which mobile shell is installed.
def appVersion = '1.8.58'
def appVersionCode = 1858

android {
    namespace 'id.asi.stockintelligence'
    compileSdk 35

    defaultConfig {
        applicationId 'id.asi.stockintelligence'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

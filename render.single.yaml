services:
  - type: web
    name: ai-stock-intelligence-runtime-host
    runtime: python
    region: singapore
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python deployment_preflight.py && python runtime_host.py
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.17"
      - key: ASI_PERSIST_SYNC_SECONDS
        value: "30"
      - key: ASI_UI_REPLICA_SECONDS
        value: "60"
      - key: ASI_CHECKPOINT_SECONDS
        value: "900"
      - key: ASI_CHECKPOINT_WARM_PRICE_ROWS
        value: "1000"
      - key: ASI_RUNTIME_STARTUP_GRACE_SECONDS
        value: "900"
      - key: ASI_ADMIN_USERNAME
        value: "admin"
      - key: ASI_ADMIN_DISPLAY_NAME
        value: "Lana Admin"
      - key: ASI_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false

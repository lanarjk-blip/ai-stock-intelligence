name: Production Runtime Validation
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'worker_base.py'
      - 'accuracy_guardrails.py'
      - 'dynamic_engine.py'
      - 'dynamic_opportunity_ui.py'
      - 'sitecustomize.py'
      - 'premarket_scheduler.py'
      - 'premarket_preliminary.py'
      - 'premarket_ui_patch.py'
      - 'runtime_supervisor.py'
      - 'persistent_bridge.py'
      - 'runtime_api.py'
      - 'render.yaml'
      - 'config.json'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/v1851_accuracy_guardrails.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'worker_base.py'
      - 'accuracy_guardrails.py'
      - 'dynamic_engine.py'
      - 'dynamic_opportunity_ui.py'
      - 'sitecustomize.py'
      - 'premarket_scheduler.py'
      - 'premarket_preliminary.py'
      - 'premarket_ui_patch.py'
      - 'runtime_supervisor.py'
      - 'persistent_bridge.py'
      - 'runtime_api.py'
      - 'render.yaml'
      - 'config.json'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/v1851_accuracy_guardrails.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Verify production contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config.json').read_text(encoding='utf-8'))
          assert cfg['engine_version']=='1.8.52', cfg['engine_version']
          assert cfg['mobile_ui_version']=='1.8.52', cfg['mobile_ui_version']
          assert cfg['data_quality_gate_enabled'] is True
          worker=Path('worker_base.py').read_text(encoding='utf-8')
          assert 'DATA_QUALITY' in worker and 'accuracy_guardrails' in worker
          guard=Path('accuracy_guardrails.py').read_text(encoding='utf-8')
          assert 'asi-premarket-h10' in guard and 'asi-premarket-preliminary' in guard
          watchdog=Path('sitecustomize.py').read_text(encoding='utf-8')
          assert '_IS_REAL_WORKER' in watchdog
          assert 'runtime_supervisor' in watchdog and 'persistent_bridge' in watchdog
          assert 'query2.finance.yahoo.com' in watchdog and 'primary_error' in watchdog
          supervisor=Path('runtime_supervisor.py').read_text(encoding='utf-8')
          assert 'DUPLICATE_EXIT' in supervisor and 'SIGTERM' in supervisor
          bridge=Path('persistent_bridge.py').read_text(encoding='utf-8')
          assert 'DATABASE_URL' in bridge and 'restore_local_from_api' in bridge
          api=Path('runtime_api.py').read_text(encoding='utf-8')
          assert '/health' in api and '/bootstrap' in api
          preliminary=Path('premarket_preliminary.py').read_text(encoding='utf-8')
          assert 'ensure_on_open' in preliminary and 'PRELIMINARY_ON_OPEN' in preliminary
          blueprint=Path('render.yaml').read_text(encoding='utf-8')
          assert 'type: worker' in blueprint and 'type: web' in blueprint
          print('production stabilization contract OK')
          PY
      - name: Compile
        run: >-
          python -m py_compile app.py worker_base.py accuracy_guardrails.py
          dynamic_engine.py dynamic_opportunity_ui.py sitecustomize.py
          premarket_scheduler.py premarket_preliminary.py premarket_ui_patch.py
          runtime_supervisor.py persistent_bridge.py runtime_api.py
      - name: Diagnose current production Streamlit endpoint
        run: |
          set +e
          for URL in \
            'https://ai-stock-intelligence-zijcl2pi2kjweeappbkjiy.streamlit.app' \
            'https://ai-stock-intelligence-zijcl2pi2kjweeappbkjiy.streamlit.app/_stcore/health'
          do
            echo "=== $URL ==="
            curl -sS -D - -o /tmp/streamlit_body --max-redirs 0 --max-time 20 "$URL" || true
            head -c 300 /tmp/streamlit_body 2>/dev/null || true
            echo
          done
          exit 0
      - name: Live IHSG provider smoke test
        env:
          AI_ENGINE_WORKER: '1'
        run: |
          python - <<'PY'
          import app
          d=app.fetch_ihsg()
          print('IHSG rows=', 0 if d is None else len(d))
          assert d is not None and not d.empty, 'IHSG provider returned no usable rows'
          assert 'close' in d.columns
          assert float(d['close'].dropna().iloc[-1]) > 0
          PY
      - name: Live JST end-to-end training smoke test
        env:
          AI_ENGINE_WORKER: '1'
        run: |
          python - <<'PY'
          import pandas as pd
          import app
          tickers=['BBCA','BBRI','BMRI','TLKM','ASII','ANTM','INDF','ICBP','ADRO','UNTR','PGAS','KLBF']
          universe=pd.DataFrame({'ticker':tickers,'company':tickers})
          ih=app.fetch_ihsg(); assert ih is not None and not ih.empty
          app.save_ihsg(ih)
          ok=0
          for ticker in tickers:
              try:
                  d=app.fetch_chart(ticker,220,'1d')
                  if d is not None and not d.empty:
                      app.save_daily(d,ticker); ok += 1
              except Exception as exc:
                  print(ticker, 'ERROR', repr(exc))
          assert ok >= 10, f'only {ok} stock histories fetched'
          con=app.dbcon(); tr=app.build_training_rows(con,tickers,horizon=int(app.CFGD.get('primary_target_horizon',3))); con.close()
          assert len(tr) >= 500, f'JST training rows too low: {len(tr)}'
          model, rows, accuracy=app.train_jst(universe)
          print('JST rows=',rows,'accuracy=',accuracy)
          assert model is not None and rows >= 500
          PY
      - name: Model analysis and opportunity snapshot smoke test
        env:
          AI_ENGINE_WORKER: '1'
        run: |
          python - <<'PY'
          import pandas as pd
          import app, dynamic_engine, worker_base
          tickers=['BBCA','BBRI','BMRI','TLKM','ASII','ANTM','INDF','ICBP','ADRO','UNTR','PGAS','KLBF']
          universe=pd.DataFrame({'ticker':tickers,'company':tickers})
          model=app.load_jst(); assert model is not None
          result=app.analyze_all(universe,model)
          assert result is not None and not result.empty
          saved=worker_base.save_opportunities(result,'ci-smoke')
          assert saved == len(result) and saved > 0
          dynamic=dynamic_engine.update(result,phase='CI_SMOKE')
          assert dynamic is not None and not dynamic.empty
          assert len(dynamic) <= int(app.CFGD.get('dynamic_opportunity_count',5))
          PY
      - name: Regression tests
        run: >-
          python -m pytest -q
          test_batch1_live_engine.py
          test_mobile_ui_v1848.py
          tests/test_accuracy_guardrails_v1852.py
          tests/test_runtime_consistency_v1852.py
          tests/test_ihsg_failover_v1852.py
          tests/test_runtime_stabilization_v1853.py

name: Production Runtime Validation
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'timemap_*.py'
      - 'trading_monitor.py'
      - 'trading_groups.py'
      - 'worker_base.py'
      - 'accuracy_guardrails.py'
      - 'research_feedback.py'
      - 'ensemble_safety.py'
      - 'dynamic_engine.py'
      - 'dynamic_opportunity_ui.py'
      - 'ui_theme_patch.py'
      - 'storage_housekeeping.py'
      - 'runtime_selfcheck.py'
      - 'market_session.py'
      - 'data/idx_holidays.json'
      - 'sitecustomize.py'
      - 'premarket_scheduler.py'
      - 'premarket_preliminary.py'
      - 'premarket_ui_patch.py'
      - 'runtime_health.py'
      - 'runtime_health_ui_patch.py'
      - 'runtime_supervisor.py'
      - 'persistent_bridge.py'
      - 'ui_replica.py'
      - 'replica_runtime.py'
      - 'external_runtime_guard.py'
      - 'runtime_api.py'
      - 'runtime_host.py'
      - 'runtime_host_api.py'
      - 'deployment_preflight.py'
      - 'render.yaml'
      - 'render.single.yaml'
      - 'config.json'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/v1851_accuracy_guardrails.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'timemap_*.py'
      - 'trading_monitor.py'
      - 'trading_groups.py'
      - 'worker_base.py'
      - 'accuracy_guardrails.py'
      - 'research_feedback.py'
      - 'ensemble_safety.py'
      - 'dynamic_engine.py'
      - 'dynamic_opportunity_ui.py'
      - 'ui_theme_patch.py'
      - 'storage_housekeeping.py'
      - 'runtime_selfcheck.py'
      - 'market_session.py'
      - 'data/idx_holidays.json'
      - 'sitecustomize.py'
      - 'premarket_scheduler.py'
      - 'premarket_preliminary.py'
      - 'premarket_ui_patch.py'
      - 'runtime_health.py'
      - 'runtime_health_ui_patch.py'
      - 'runtime_supervisor.py'
      - 'persistent_bridge.py'
      - 'ui_replica.py'
      - 'replica_runtime.py'
      - 'external_runtime_guard.py'
      - 'runtime_api.py'
      - 'runtime_host.py'
      - 'runtime_host_api.py'
      - 'deployment_preflight.py'
      - 'render.yaml'
      - 'render.single.yaml'
      - 'config.json'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/v1851_accuracy_guardrails.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Verify production contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config.json').read_text(encoding='utf-8'))
          assert cfg['engine_version']=='1.8.57', cfg['engine_version']
          assert cfg['mobile_ui_version']=='1.8.58', cfg['mobile_ui_version']
          assert cfg['production_stabilization_version']=='1.8.57', cfg['production_stabilization_version']
          assert cfg['ensemble_safety_version']=='R55-R60-ADAPTIVE-ENSEMBLE-1'
          assert cfg['data_quality_gate_enabled'] is True
          assert cfg['runtime_heartbeat_max_age_seconds']==180
          assert cfg['housekeeping_enabled'] is True
          assert cfg['housekeeping_intraday_retention_days']==45
          assert cfg['housekeeping_engine_log_retention_days']==21
          calendar=json.loads(Path('data/idx_holidays.json').read_text(encoding='utf-8'))
          assert set(calendar['holidays']['2026']) == set(cfg['market_holidays'])
          assert {2026, 2027}.issubset(calendar['verified_years'])
          worker=Path('worker_base.py').read_text(encoding='utf-8')
          assert 'DATA_QUALITY' in worker and 'accuracy_guardrails' in worker
          guard=Path('accuracy_guardrails.py').read_text(encoding='utf-8')
          assert 'asi-premarket-h10' in guard and 'asi-premarket-preliminary' in guard
          assert 'asi-storage-housekeeping' in guard and 'runtime_selfcheck.run()' in guard
          assert 'research_feedback' in guard and 'ensemble_safety' in guard
          ensemble=Path('ensemble_safety.py').read_text(encoding='utf-8')
          assert 'NumpyBoostedStumps' in ensemble and 'NO_TRADE_GUARD' in ensemble
          assert '_never_promote' in ensemble and 'production_enabled' in ensemble
          housekeeping=Path('storage_housekeeping.py').read_text(encoding='utf-8')
          assert 'PROTECTED_TABLES' in housekeeping and 'DISPOSABLE_RULES' in housekeeping
          assert 'PRAGMA quick_check' in housekeeping and 'src.backup(dst)' in housekeeping
          theme=Path('ui_theme_patch.py').read_text(encoding='utf-8')
          assert 'UP %' in theme and 'Sideways %' in theme and 'DOWN %' in theme
          watchdog=Path('sitecustomize.py').read_text(encoding='utf-8')
          assert '_IS_REAL_WORKER' in watchdog and '_IS_RUNTIME_API' in watchdog
          assert 'runtime_supervisor' in watchdog and 'persistent_bridge' in watchdog
          assert 'replica_runtime.start_worker_replica()' in watchdog
          assert 'replica_runtime.start_ui_pull()' in watchdog
          assert 'external_runtime_guard.install()' in watchdog
          assert 'runtime_health_ui_patch.install()' in watchdog
          assert 'query2.finance.yahoo.com' in watchdog and 'primary_error' in watchdog
          health=Path('runtime_health.py').read_text(encoding='utf-8')
          assert 'RUNTIME_STALE' in health and 'remote_worker_heartbeat_at' in health
          health_ui=Path('runtime_health_ui_patch.py').read_text(encoding='utf-8')
          assert 'dynamic_opportunity_ui._quality_gate_state = quality_gate_state' in health_ui
          assert 'premarket_ui_patch._ensure_premarket_on_open = ensure_premarket_on_open' in health_ui
          session=Path('market_session.py').read_text(encoding='utf-8')
          assert 'idx_holidays.json' in session and 'market_holidays' in session
          supervisor=Path('runtime_supervisor.py').read_text(encoding='utf-8')
          assert 'DUPLICATE_EXIT' in supervisor and 'SIGTERM' in supervisor
          bridge=Path('persistent_bridge.py').read_text(encoding='utf-8')
          assert 'DATABASE_URL' in bridge and 'restore_local_from_api' in bridge
          assert 'asi_worker_checkpoint' in bridge and 'PRAGMA quick_check' in bridge
          replica=Path('ui_replica.py').read_text(encoding='utf-8')
          assert 'dynamic_opportunities' in replica and 'recommendation_history' in replica
          assert 'prices' not in replica.split('TABLE_SPECS =',1)[1].split('SAFE_JSON_FILES',1)[0]
          assert '[REDACTED]' in replica
          external=Path('external_runtime_guard.py').read_text(encoding='utf-8')
          assert 'worker_base.py' in external and 'subprocess.Popen = guarded_popen' in external
          api=Path('runtime_api.py').read_text(encoding='utf-8')
          assert '/health' in api and '/bootstrap' in api and 'ui_replica' in api
          host=Path('runtime_host.py').read_text(encoding='utf-8')
          host_api=Path('runtime_host_api.py').read_text(encoding='utf-8')
          preflight=Path('deployment_preflight.py').read_text(encoding='utf-8')
          single=Path('render.single.yaml').read_text(encoding='utf-8')
          assert 'runtime_host_api:app' in host
          assert '@app.get("/ready")' in host_api and 'startup_grace' in host_api
          assert 'DATABASE_URL_MISSING' in preflight and '--require-live-runtime' in preflight
          assert 'super-secret-password' not in preflight
          assert 'healthCheckPath: /ready' in single and 'ASI_RUNTIME_STARTUP_GRACE_SECONDS' in single
          preliminary=Path('premarket_preliminary.py').read_text(encoding='utf-8')
          assert 'ensure_on_open' in preliminary and 'PRELIMINARY_ON_OPEN' in preliminary
          blueprint=Path('render.yaml').read_text(encoding='utf-8')
          assert 'type: worker' in blueprint and 'type: web' in blueprint
          assert 'ASI_CHECKPOINT_SECONDS' in blueprint
          print('production stabilization + runtime safety contract OK')
          PY
      - name: Compile
        run: >-
          python -m py_compile app.py worker_base.py accuracy_guardrails.py research_feedback.py
          ensemble_safety.py dynamic_engine.py dynamic_opportunity_ui.py ui_theme_patch.py
          storage_housekeeping.py runtime_selfcheck.py market_session.py sitecustomize.py
          premarket_scheduler.py premarket_preliminary.py premarket_ui_patch.py
          runtime_health.py runtime_health_ui_patch.py runtime_supervisor.py
          persistent_bridge.py ui_replica.py replica_runtime.py
          external_runtime_guard.py runtime_api.py runtime_host.py runtime_host_api.py
          deployment_preflight.py trading_monitor.py trading_groups.py timemap_forecast.py timemap_forecast_ui.py
      - name: Diagnose current production Streamlit endpoint
        run: |
          set +e
          for URL in \
            'https://ai-stock-intelligence-zijcl2pi2kjweeappbkjiy.streamlit.app' \
            'https://ai-stock-intelligence-zijcl2pi2kjweeappbkjiy.streamlit.app/_stcore/health'
          do
            echo "=== $URL ==="
            curl -sS -D - -o /tmp/streamlit_body --max-redirs 0 --max-time 20 "$URL" || true
            head -c 300 /tmp/streamlit_body 2>/dev/null || true
            echo
          done
          exit 0
      - name: Live IHSG provider smoke test
        env:
          AI_ENGINE_WORKER: '1'
        run: |
          python - <<'PY'
          import time
          import app
          d=None
          for attempt in range(1, 4):
              d=app.fetch_ihsg()
              rows=0 if d is None else len(d)
              print(f'IHSG attempt={attempt} rows={rows}')
              if d is not None and not d.empty and 'close' in d.columns and not d['close'].dropna().empty:
                  break
              if attempt < 3:
                  time.sleep(3)
          assert d is not None and not d.empty, 'IHSG provider returned no usable rows after 3 attempts'
          assert 'close' in d.columns
          assert not d['close'].dropna().empty
          assert float(d['close'].dropna().iloc[-1]) > 0
          PY
      - name: Live JST end-to-end training smoke test
        env:
          AI_ENGINE_WORKER: '1'
        run: |
          python - <<'PY'
          import time
          import pandas as pd
          import app
          tickers=['BBCA','BBRI','BMRI','TLKM','ASII','ANTM','INDF','ICBP','ADRO','UNTR','PGAS','KLBF']
          universe=pd.DataFrame({'ticker':tickers,'company':tickers})
          ih=None
          for attempt in range(1, 4):
              ih=app.fetch_ihsg()
              rows=0 if ih is None else len(ih)
              print(f'JST IHSG attempt={attempt} rows={rows}')
              if ih is not None and not ih.empty:
                  break
              if attempt < 3:
                  time.sleep(3)
          assert ih is not None and not ih.empty, 'IHSG unavailable for JST smoke after 3 attempts'
          app.save_ihsg(ih)
          ok=0
          for ticker in tickers:
              try:
                  d=app.fetch_chart(ticker,220,'1d')
                  if d is not None and not d.empty:
                      app.save_daily(d,ticker); ok += 1
              except Exception as exc:
                  print(ticker, 'ERROR', repr(exc))
          assert ok >= 10, f'only {ok} stock histories fetched'
          con=app.dbcon(); tr=app.build_training_rows(con,tickers,horizon=int(app.CFGD.get('primary_target_horizon',3))); con.close()
          assert len(tr) >= 500, f'JST training rows too low: {len(tr)}'
          model, rows, accuracy=app.train_jst(universe)
          print('JST rows=',rows,'accuracy=',accuracy)
          assert model is not None and rows >= 500
          PY
      - name: Model analysis and opportunity snapshot smoke test
        env:
          AI_ENGINE_WORKER: '1'
        run: |
          python - <<'PY'
          import pandas as pd
          import app, dynamic_engine, worker_base
          tickers=['BBCA','BBRI','BMRI','TLKM','ASII','ANTM','INDF','ICBP','ADRO','UNTR','PGAS','KLBF']
          universe=pd.DataFrame({'ticker':tickers,'company':tickers})
          model=app.load_jst(); assert model is not None
          result=app.analyze_all(universe,model)
          assert result is not None and not result.empty
          saved=worker_base.save_opportunities(result,'ci-smoke')
          assert saved == len(result) and saved > 0
          dynamic=dynamic_engine.update(result,phase='CI_SMOKE')
          assert dynamic is not None and not dynamic.empty
          assert len(dynamic) <= int(app.CFGD.get('dynamic_opportunity_count',5))
          PY
      - name: Full regression suite
        run: python -m pytest -q

name: V1.8.51 Accuracy Guardrails
on:
  push:
    paths:
      - '.github/workflows/v1851_accuracy_guardrails.yml'
permissions:
  contents: write
jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1851-accuracy-guardrails
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Integrate publication quality gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker_base.py')
          s=p.read_text(encoding='utf-8')
          if 'import accuracy_guardrails' not in s:
              s=s.replace('import market_session\n','import market_session\nimport accuracy_guardrails\n',1)
          anchor='''    if res is None or res.empty:\n\n        log(\n            "SCAN",\n            "EMPTY",\n            source,\n        )\n\n        return pd.DataFrame()\n\n    saved = save_opportunities('''
          replacement='''    if res is None or res.empty:\n\n        log(\n            "SCAN",\n            "EMPTY",\n            source,\n        )\n\n        return pd.DataFrame()\n\n    # V1.8.51: never publish full-universe BUY/Top-5 output from weak data.\n    # Analysis can run for diagnostics, but publication waits for broad, fresh coverage.\n    if str(source).lower() == "full-universe" and CFG.get("data_quality_gate_enabled", True):\n        quality = accuracy_guardrails.evaluate_data_quality(\n            universe_count=len(universe),\n            collected_ok=app.state_get("last_collection_ok") or 0,\n            ready_symbols=count_ready_symbols(60),\n            price_rows=count_price_rows(),\n            last_collection=app.state_get("last_collection"),\n            min_collection_ratio=CFG.get("data_quality_min_collection_ratio", 0.80),\n            min_ready_ratio=CFG.get("data_quality_min_ready_ratio", 0.70),\n            min_price_rows=CFG.get("data_quality_min_price_rows", 5000),\n            max_age_hours=CFG.get("data_quality_max_age_hours", 8),\n        )\n        app.state_set("data_quality_status", quality["status"])\n        app.state_set("data_quality_collection_ratio", quality["collection_ratio"])\n        app.state_set("data_quality_ready_ratio", quality["ready_ratio"])\n        app.state_set("data_quality_reasons", " | ".join(quality["reasons"]))\n        if not quality["ready"]:\n            log("DATA_QUALITY", "BLOCK", " | ".join(quality["reasons"]))\n            return pd.DataFrame()\n        log(\n            "DATA_QUALITY",\n            "READY",\n            f"collection={quality['collection_ratio']:.1%} ready={quality['ready_ratio']:.1%} rows={quality['price_rows']}",\n        )\n\n    saved = save_opportunities('''
          if 'DATA_QUALITY", "BLOCK"' not in s:
              if anchor not in s:
                  raise SystemExit('analysis publication anchor not found')
              s=s.replace(anchor,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Compile
        run: python -m py_compile worker_base.py app.py accuracy_guardrails.py
      - name: Guardrail unit tests
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          from accuracy_guardrails import evaluate_data_quality
          now=datetime.now(timezone.utc)
          good=evaluate_data_quality(universe_count=957,collected_ok=915,ready_symbols=900,price_rows=100000,last_collection=now.isoformat(),now=now)
          assert good['ready'] and good['status']=='READY'
          broken=evaluate_data_quality(universe_count=957,collected_ok=0,ready_symbols=1,price_rows=120,last_collection=now.isoformat(),now=now)
          assert not broken['ready'] and broken['status']=='DATA_NOT_READY'
          stale=evaluate_data_quality(universe_count=957,collected_ok=915,ready_symbols=900,price_rows=100000,last_collection=(now-timedelta(hours=12)).isoformat(),now=now)
          assert not stale['ready'] and any('collection age' in x for x in stale['reasons'])
          print('V1.8.51 quality gate tests passed')
          PY
      - name: Regression tests
        run: python -m pytest -q test_batch1_live_engine.py test_mobile_ui_v1848.py
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker_base.py accuracy_guardrails.py config.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No integration changes to commit'
          else
            git commit -m 'V1.8.51 enforce recommendation data quality gate'
            git push origin HEAD:v1851-accuracy-guardrails
          fi

name: R23 Persistence Roundtrip
on:
  push:
    branches: [fix-actionability-integrity-r23]
    paths:
      - 'tools/apply_r23_persistence_patch.py'
      - '.github/workflows/r23_persistence_roundtrip.yml'
permissions:
  contents: write
jobs:
  persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-actionability-integrity-r23
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -q -r requirements.txt pytest
      - name: Apply persistence patch
        run: python tools/apply_r23_persistence_patch.py
      - name: Compile
        run: python -m py_compile persistent_bridge.py
      - name: Verify Pre-Market reference price survives replica roundtrip
        run: |
          python - <<'PY'
          import os, sqlite3, tempfile
          import persistent_bridge

          td=tempfile.mkdtemp(prefix='asi-persist-r23-')
          persistent_bridge.DB_DIR=td
          persistent_bridge.LOCAL_DB=os.path.join(td,'market.db')
          payload=[{
            'market_date':'2026-10-15','generated_at':'x','rank':1,'ticker':'TEST','company':'Test',
            'decision':'WAIT','confidence':70.0,'ai_score':75.0,'risk':'LOW','reference_price':1234.0,
            'entry_low':1220.0,'entry_high':1240.0,'stop_loss':1180.0,'target_1':1300.0,'target_2':1350.0,
            'ihsg_regime':'SIDEWAYS','reason':'test','source_phase':'test'
          }]
          counts=persistent_bridge._write_local_payload({},[],[{
            'market_date':'2026-10-15','generated_at':'x','status':'PRELIMINARY','pick_count':1,'note':'test'
          }],payload)
          assert counts['picks']==1
          con=sqlite3.connect(persistent_bridge.LOCAL_DB)
          cols={r[1] for r in con.execute('PRAGMA table_info(premarket_picks)').fetchall()}
          assert 'reference_price' in cols, cols
          row=con.execute("SELECT reference_price,entry_low,entry_high FROM premarket_picks WHERE ticker='TEST'").fetchone()
          con.close()
          assert row==(1234.0,1220.0,1240.0), row
          print('R23 PERSISTENCE ROUNDTRIP PASSED')
          PY
      - name: Full tests
        run: python -m pytest -q
      - name: Commit validated persistence patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add persistent_bridge.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve Pre-Market reference price through persistence bridge'
          git push origin HEAD:fix-actionability-integrity-r23

name: R26 Worker Efficiency
on:
  push:
    branches: [optimize-worker-r26]
    paths:
      - 'tools/apply_r26_worker_efficiency.py'
      - 'tests/test_worker_efficiency_r26.py'
      - '.github/workflows/r26_worker_efficiency.yml'
permissions:
  contents: write
jobs:
  efficiency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-worker-r26
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply R26 patch
        run: python tools/apply_r26_worker_efficiency.py
      - name: Compile worker
        run: python -m py_compile worker_base.py
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: R26 targeted behavior tests
        run: python -m pytest -q tests/test_worker_efficiency_r26.py
      - name: Full regression suite
        run: python -m pytest -q
      - name: Static efficiency contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('worker_base.py').read_text(encoding='utf-8')
          assert 'def collect_fast(universe, state_prefix="last_collection")' in s
          assert 'def full_collection_status' in s
          assert 'last_bootstrap_collection' in s
          assert 'SKIP_FRESH_CACHE' in s
          assert 'force=True' not in s[s.index('# PHASE 4'):s.index('# PHASE 5')]
          assert 'def cycle_interval_seconds' in s
          assert 'market_open_cycle_minutes' in s and 'off_market_cycle_minutes' in s
          assert 'cold_start = not bool(app.state_get("engine_last_run"))' in s
          print('R26 efficiency contract passed')
          PY
      - name: Commit production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker_base.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Honor collection and retraining cadence'
          git pull --rebase origin optimize-worker-r26
          git push origin HEAD:optimize-worker-r26

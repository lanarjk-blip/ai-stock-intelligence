# trigger: 2026-10-15 R22.1
name: Production On-Open Pre-Market Hotfix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app_onopen_premarket_hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch app on-open recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          if 'def _ensure_premarket_on_open():' not in s:
              old="""def render_premarket_panel():\n    run=read_premarket_run()\n    st.subheader('🌅 Pre-Market Top Picks')"""
              new="""def _ensure_premarket_on_open():\n    \"\"\"Recover preliminary candidates synchronously when the UI opens.\"\"\"\n    try:\n        import premarket_preliminary\n        result=premarket_preliminary.ensure_on_open() or {}\n        state_set('premarket_on_open_status',str(result.get('status','UNKNOWN')))\n        state_set('premarket_on_open_at',datetime.now(timezone.utc).isoformat())\n        return result\n    except Exception as exc:\n        state_set('premarket_on_open_status','ERROR')\n        state_set('premarket_on_open_error',str(exc)[:500])\n        return {'status':'ERROR','error':str(exc)}\n\n\ndef render_premarket_panel():\n    recovery=_ensure_premarket_on_open()\n    run=read_premarket_run()\n    st.subheader('🌅 Pre-Market Top Picks')\n    st.caption('Runtime recovery R22.1 • on-open lightweight preliminary aktif • H-10 final 08:50 WIB')"""
              if old not in s: raise SystemExit('render anchor not found')
              s=s.replace(old,new,1)
          s=s.replace('premarket_preliminary.publish_preliminary()','premarket_preliminary.ensure_on_open()')
          s=s.replace('Runtime recovery R22 • on-open preliminary aktif • H-10 final 08:50 WIB','Runtime recovery R22.1 • on-open lightweight preliminary aktif • H-10 final 08:50 WIB')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m py_compile app.py premarket_preliminary.py premarket_scheduler.py
          grep -q 'Runtime recovery R22.1' app.py
          grep -q 'premarket_preliminary.ensure_on_open()' app.py
          ! grep -q 'premarket_preliminary.publish_preliminary()' app.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use lightweight Pre-Market recovery on app open'
          git push origin HEAD:main

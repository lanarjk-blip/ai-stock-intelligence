name: R23 Worker Ownership and Hold
on:
  push:
    branches: [fix-actionability-integrity-r23]
    paths:
      - 'tools/apply_r23_worker_wiring_patch.py'
      - '.github/workflows/r23_worker_ownership_hold.yml'
permissions:
  contents: write
jobs:
  worker-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-actionability-integrity-r23
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -q -r requirements.txt pytest
      - name: Apply worker ownership patch
        run: python tools/apply_r23_worker_wiring_patch.py
      - name: Compile
        run: python -m py_compile worker_base.py hold_engine.py
      - name: Verify writer ownership and Hold behavior
        env:
          AI_ENGINE_WORKER: '0'
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import pandas as pd
          import hold_engine

          text=Path('worker_base.py').read_text(encoding='utf-8')
          tree=ast.parse(text)
          calls=[n for n in ast.walk(tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=='lock_premarket_picks']
          assert len(calls)==0, f'legacy premarket writer still called: {len(calls)}'
          assert 'PRELIM-R2/H10-R1 own writes' in text
          assert 'import hold_engine' in text and 'hold_engine.update(res, phase=hold_phase)' in text
          assert 'market_session.session_status(CFG)' in text

          # Hold engine must not turn sell/avoid aliases into HOLD candidates.
          sell=pd.DataFrame([
              {'ticker':'S1','company':'Sell','decision':'SELL','ai_score':95,'relative_percentile':.99,'relative_rank_score':99,
               'jst_p_up':.9,'jst_p_down':.05,'jst_confidence':.9,'risk':'LOW','close':100,'stop_loss':90,'target_1':110,'target_2':120,
               'risk_reward_2':2,'invalidation':'x','market_regime':'BULLISH','market_score':70},
              {'ticker':'S2','company':'Avoid','decision':'STRONG_SELL','ai_score':95,'relative_percentile':.99,'relative_rank_score':98,
               'jst_p_up':.9,'jst_p_down':.05,'jst_confidence':.9,'risk':'LOW','close':100,'stop_loss':90,'target_1':110,'target_2':120,
               'risk_reward_2':2,'invalidation':'x','market_regime':'BULLISH','market_score':70},
          ])
          out=hold_engine.update(sell,phase='CLOSED')
          assert out.empty, out

          # A valid BUY remains eligible. Stub data-dependent helpers for deterministic behavior.
          hold_engine._time=lambda t:{'edge':.1,'confidence':.8,'horizon':'EOD','status':'ACTIVE'}
          hold_engine._daily_context=lambda t:{'trend':'BULLISH','ret5':.05,'vol_ratio':1.2}
          hold_engine._ihsg_context=lambda :('BULLISH',70,.01,.02)
          buy=sell.iloc[[0]].copy()
          buy.loc[:,'ticker']='B1'; buy.loc[:,'decision']='STRONG_BUY'
          out=hold_engine.update(buy,phase='CLOSED')
          assert not out.empty
          assert out.iloc[0]['state'] in {'HOLD CANDIDATE','HOLD / MONITOR','REVIEW'}
          assert out.iloc[0]['overnight_state']!='PENDING_CLOSE'
          print('R23 WORKER OWNERSHIP + HOLD BEHAVIOR PASSED')
          PY
      - name: Full tests
        run: python -m pytest -q
      - name: Commit validated worker changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker_base.py hold_engine.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Give H10 exclusive Pre-Market ownership and wire Hold Intelligence'
          git pull --rebase origin fix-actionability-integrity-r23
          git push origin HEAD:fix-actionability-integrity-r23

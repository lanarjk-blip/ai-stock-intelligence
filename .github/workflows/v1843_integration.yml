name: V1.8.45 AI Stock Ask Integration

on:
  push:
    paths:
      - '.github/workflows/v1843_integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -q pytest pandas numpy requests streamlit
      - name: Wire AI Stock Ask UI
        shell: python
        run: |
          from pathlib import Path
          app=Path('app.py')
          text=app.read_text(encoding='utf-8')
          if 'import ai_stock_ask\n' not in text:
              text=text.replace('import recommendation_history\n','import recommendation_history\nimport ai_stock_ask\n',1)
          text=text.replace("AI Stock Intelligence V1.8.43", "AI Stock Intelligence V1.8.45")
          anchor="""    st.markdown('### 🚨 Smart Monitoring & Alert Engine')\n"""
          block="""    st.markdown('### 💬 AI Stock Ask')\n    ask_horizon=st.radio('Horizon AI Stock Ask',['TODAY','TOMORROW'],horizontal=True,key=f'ai_ask_horizon_{selected_ticker}')\n    ask_snapshot={} if ur is None else ur.to_dict()\n    if dr is not None:\n        for k,v in dr.to_dict().items():\n            if k not in ask_snapshot or pd.isna(ask_snapshot.get(k)):\n                ask_snapshot[k]=v\n    ask_snapshot['ticker']=selected_ticker\n    ask=ai_stock_ask.answer_stock(ask_snapshot,ask_horizon)\n    ask_action=str(ask.get('action','WAIT')).upper()\n    if ask_action=='BUY': st.success(f\"🟢 **{ask.get('headline')}**\")\n    elif ask_action=='AVOID': st.error(f\"🔴 **{ask.get('headline')}**\")\n    else: st.warning(f\"🟡 **{ask.get('headline')}**\")\n    st.write(ask.get('reason',''))\n    levels=ask.get('levels',{}) or {}\n    al1,al2,al3,al4,al5=st.columns(5)\n    def _ask_price(k):\n        v=levels.get(k)\n        return f'Rp {float(v):,.0f}' if v is not None and pd.notna(v) else '—'\n    entry_text='—'\n    if levels.get('entry_low') is not None and levels.get('entry_high') is not None:\n        entry_text=f\"Rp {float(levels['entry_low']):,.0f} - {float(levels['entry_high']):,.0f}\"\n    al1.metric('Harga',_ask_price('close')); al2.metric('Entry',entry_text); al3.metric('Stop Loss',_ask_price('stop_loss')); al4.metric('Target 1',_ask_price('target_1')); al5.metric('Target 2',_ask_price('target_2'))\n    st.caption(ask.get('guardrail',''))\n\n    st.markdown('### 🚨 Smart Monitoring & Alert Engine')\n"""
          if '### 💬 AI Stock Ask' not in text:
              if anchor not in text: raise SystemExit('AI Ask UI anchor missing')
              text=text.replace(anchor,block,1)
          app.write_text(text,encoding='utf-8')

          Path('test_ai_stock_ask.py').write_text('''from ai_stock_ask import answer_stock\n\n\ndef test_buy_when_strong_and_entry_active():\n    r=answer_stock({"ticker":"TEST","decision":"BUY","ai_score":80,"jst_p_up":.70,"entry_status":"ACTIVE","risk":"MEDIUM","market_regime":"BULLISH","entry_low":100,"entry_high":102,"stop_loss":95,"target_1":110},"TODAY")\n    assert r["action"]=="BUY"\n    assert r["levels"]["entry_low"]==100\n\ndef test_wait_when_entry_not_confirmed():\n    r=answer_stock({"ticker":"TEST","decision":"BUY","ai_score":80,"jst_p_up":.70,"entry_status":"WAIT","risk":"LOW"},"TODAY")\n    assert r["action"]=="WAIT"\n\ndef test_avoid_high_risk_or_bearish_tomorrow():\n    assert answer_stock({"ticker":"A","decision":"BUY","ai_score":90,"jst_p_up":.8,"risk":"HIGH"},"TODAY")["action"]=="AVOID"\n    assert answer_stock({"ticker":"B","decision":"BUY","ai_score":90,"jst_p_up":.8,"risk":"LOW","market_regime":"BEARISH"},"TOMORROW")["action"]=="AVOID"\n\ndef test_missing_ticker_never_invents_answer():\n    assert answer_stock({},"TODAY")["status"]=="NO_DATA"\n''',encoding='utf-8')
      - name: Compile Python
        run: python -m py_compile app.py ai_stock_ask.py closing_overnight.py worker_base.py premarket_intelligence.py premarket_evaluation.py premarket_explain.py
      - name: Run all roadmap focused tests
        run: python -m pytest -q test_ai_stock_ask.py test_closing_overnight.py test_premarket_intelligence.py test_premarket_explain.py test_batch1_live_engine.py
      - name: Verify UI wiring
        run: |
          grep -q 'import ai_stock_ask' app.py
          grep -q '### 💬 AI Stock Ask' app.py
          grep -q 'AI Stock Intelligence V1.8.45' app.py
      - name: Commit Batch 4 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py test_ai_stock_ask.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V1.8.45 wire grounded AI Stock Ask into deep analysis'
          git push

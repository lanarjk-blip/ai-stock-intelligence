name: V1.8.43 Integration

on:
  push:
    paths:
      - '.github/workflows/v1843_integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install -q pytest pandas
      - name: Wire V1.8.43 backend and UI
        shell: python
        run: |
          from pathlib import Path

          worker = Path('worker_base.py')
          text = worker.read_text(encoding='utf-8')
          text = text.replace(
              'import recommendation_history\nimport top5_timeline\n',
              'import recommendation_history\nimport top5_timeline\nimport premarket_intelligence\nimport premarket_evaluation\n',
              1,
          )
          text = text.replace(
              'event_result = top5_timeline.record_top5(app.DB, dynamic, source_phase=source)',
              'event_result = top5_timeline.record_top5(app.DB, dynamic, source_phase=source, config=CFG)',
              1,
          )
          old = '''    c = pd.DataFrame() if res is None else res.copy()\n    if not c.empty:\n        if "decision" in c.columns:\n            d = c["decision"].astype(str).str.upper()\n            c = c[~d.isin(["SELL","EXIT","AVOID"])].copy()\n            d = c["decision"].astype(str).str.upper()\n            buy = c[d.isin(["BUY","STRONG_BUY"])].copy()\n            if not buy.empty:\n                c = buy\n        if "ai_score" in c.columns:\n            s = pd.to_numeric(c["ai_score"], errors="coerce")\n            c = c[s >= float(CFG.get("premarket_min_ai_score",60.0))].copy()\n        if "jst_p_up" in c.columns:\n            p = pd.to_numeric(c["jst_p_up"], errors="coerce")\n            p = p.where(p <= 1.0, p/100.0)\n            c = c[p.isna() | (p >= float(CFG.get("premarket_min_p_up",0.55)))].copy()\n\n        cols=[]; asc=[]\n        for col,a in [("decision_priority",True),("decision_score",False),\n                      ("relative_rank_score",False),("ai_score",False)]:\n            if col in c.columns:\n                cols.append(col); asc.append(a)\n        if cols:\n            c = c.sort_values(cols, ascending=asc)\n        c = c.head(max(0,min(5,int(CFG.get("premarket_max_picks",5))))).reset_index(drop=True)\n'''
          new = '''    selection = premarket_intelligence.select_high_conviction(res, CFG)\n    c = selection["picks"].copy()\n'''
          if old not in text:
              raise SystemExit('worker premarket selection block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '(market_date,generated_at,"NO_TRADE",0,\n                 "No candidate passed pre-market quality gates."))',
              '(market_date,generated_at,"NO_TRADE",0,\n                 str(selection.get("reason") or "No candidate passed pre-market quality gates.")))',
              1,
          )
          worker.write_text(text, encoding='utf-8')

          app = Path('app.py')
          ui = app.read_text(encoding='utf-8')
          if 'from dynamic_opportunity_ui import render_actionable_dynamic' not in ui:
              anchor = 'import streamlit as st\n'
              if anchor not in ui:
                  raise SystemExit('app import anchor not found')
              ui = ui.replace(anchor, anchor + 'from dynamic_opportunity_ui import render_actionable_dynamic\n', 1)
          ui = ui.replace("st.title('📈 AI Stock Intelligence V1.8.42')", "st.title('📈 AI Stock Intelligence V1.8.43')", 1)
          app.write_text(ui, encoding='utf-8')
      - name: Compile changed Python
        run: python -m py_compile worker_base.py premarket_intelligence.py premarket_evaluation.py dynamic_opportunity_ui.py app.py
      - name: Run focused tests
        run: python -m pytest -q test_premarket_intelligence.py test_batch1_live_engine.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker_base.py app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V1.8.43 wire premarket selector and market session config'
          git push

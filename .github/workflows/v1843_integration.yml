name: V1.8.43 UI Integration

on:
  push:
    paths:
      - '.github/workflows/v1843_integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install -q pytest pandas
      - name: Wire actionable Dynamic Opportunity UI
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('app.py')
          ui = app.read_text(encoding='utf-8')
          ui = ui.replace("st.set_page_config(page_title='AI Stock Intelligence V1.8.41'", "st.set_page_config(page_title='AI Stock Intelligence V1.8.43'", 1)

          home_pattern = re.compile(
              r"(        dyn = read_dynamic_opportunities\(int\(CFGD\.get\('dynamic_opportunity_count',5\)\)\)\n"
              r"        st\.subheader\('🚀 Live Opportunity Saat Ini'\)\n"
              r"        if dyn\.empty:\n"
              r"            st\.info\('Belum ada kandidat yang memenuhi filter relatif \+ AI \+ risiko\.'\)\n)"
              r"        else:\n.*?"
              r"(?=\n        st\.subheader\('🧭 Next-Session Intelligence'\))",
              re.S,
          )
          ui, n_home = home_pattern.subn(r"\1        else:\n            render_actionable_dynamic(dyn, render_clickable_dataframe, table_limit=5)\n", ui, count=1)
          if n_home != 1:
              raise SystemExit(f'home Dynamic block replacements={n_home}')

          tab_pattern = re.compile(
              r"(    with tab_opp:\n"
              r"        st\.subheader\('🚀 Dynamic Opportunity Engine'\)\n"
              r"        dyn=read_dynamic_opportunities\(int\(CFGD\.get\('dynamic_opportunity_count',5\)\)\)\n)"
              r".*?"
              r"(?=\n        st\.subheader\('🔥 Adaptive AI Opportunities'\))",
              re.S,
          )
          ui, n_tab = tab_pattern.subn(r"\1        render_actionable_dynamic(dyn, render_clickable_dataframe)\n", ui, count=1)
          if n_tab != 1:
              raise SystemExit(f'Opportunity tab replacements={n_tab}')

          if ui.count('render_actionable_dynamic(') != 2:
              raise SystemExit(f'expected 2 renderer calls, found {ui.count("render_actionable_dynamic(")}')
          if ui.count('from dynamic_opportunity_ui import render_actionable_dynamic') != 1:
              raise SystemExit('renderer import must appear exactly once')
          app.write_text(ui, encoding='utf-8')
      - name: Compile V1.8.43 Python
        run: python -m py_compile worker_base.py premarket_intelligence.py premarket_evaluation.py dynamic_opportunity_ui.py app.py
      - name: Run focused tests
        run: python -m pytest -q test_premarket_intelligence.py test_batch1_live_engine.py
      - name: Commit UI integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V1.8.43 wire actionable Dynamic Opportunity UI'
          git push

name: V1.8.47 Production Stabilization

'on':
  push:
    paths:
      - '.github/workflows/v1843_integration.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -q pytest pandas numpy requests streamlit
      - name: Harden production scheduling and evaluation
        shell: python
        run: |
          from pathlib import Path

          p=Path('worker_base.py')
          s=p.read_text(encoding='utf-8')
          if 'import market_session\n' not in s:
              s=s.replace('import closing_overnight\n','import closing_overnight\nimport market_session\n',1)
          old='''def premarket_market_date():\n    d = _wib_now().date()\n    if d.weekday() == 5:\n        d += timedelta(days=2)\n    elif d.weekday() == 6:\n        d += timedelta(days=1)\n    return d.isoformat()\n'''
          new='''def premarket_market_date():\n    # Session-aware: after the final IDX close a new snapshot belongs to the\n    # next valid trading date, never to the session that already ended.\n    return market_session.next_trading_date(CFG, now=_wib_now(), after_close=True)\n'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'market_session.next_trading_date' not in s:
              raise SystemExit('premarket_market_date anchor changed unexpectedly')

          oldq='''        dates=[r[0] for r in con.execute(\n            "SELECT market_date FROM premarket_runs WHERE status='LOCKED' AND market_date < ? ORDER BY market_date",\n            (today,)).fetchall()]'''
          newq='''        dates=[r[0] for r in con.execute(\n            """SELECT r.market_date FROM premarket_runs r\n               WHERE r.status='LOCKED' AND r.market_date < ?\n                 AND EXISTS (SELECT 1 FROM premarket_picks p WHERE p.market_date=r.market_date)\n                 AND NOT EXISTS (\n                     SELECT 1 FROM premarket_picks p2\n                     LEFT JOIN premarket_evaluations e\n                       ON e.market_date=p2.market_date AND e.ticker=p2.ticker\n                     WHERE p2.market_date=r.market_date AND e.ticker IS NULL\n                 ) = 0\n               ORDER BY r.market_date""",\n            (today,)).fetchall()]'''
          if oldq in s:
              s=s.replace(oldq,newq,1)
          elif 'LEFT JOIN premarket_evaluations' not in s:
              raise SystemExit('evaluation query anchor changed unexpectedly')

          # INSERT OR IGNORE preserves the first completed-session evaluation.
          s=s.replace('con.executemany("""INSERT OR REPLACE INTO premarket_evaluations',
                      'con.executemany("""INSERT OR IGNORE INTO premarket_evaluations',1)
          p.write_text(s,encoding='utf-8')

          a=Path('app.py')
          text=a.read_text(encoding='utf-8').replace('AI Stock Intelligence V1.8.46','AI Stock Intelligence V1.8.47')
          a.write_text(text,encoding='utf-8')

          Path('test_market_session_v1847.py').write_text('''from datetime import datetime\nfrom zoneinfo import ZoneInfo\nimport market_session\n\nWIB=ZoneInfo("Asia/Jakarta")\n\ndef dt(y,m,d,h,minute=0): return datetime(y,m,d,h,minute,tzinfo=WIB)\n\ndef test_before_close_targets_same_market_date():\n    assert market_session.next_trading_date({},dt(2026,10,13,8,0))=="2026-10-13"\n\ndef test_after_close_targets_next_trading_date():\n    assert market_session.next_trading_date({},dt(2026,10,13,16,0))=="2026-10-14"\n\ndef test_friday_after_close_skips_weekend():\n    assert market_session.next_trading_date({},dt(2026,10,16,16,0))=="2026-10-19"\n\ndef test_weekend_and_configured_holiday_are_skipped():\n    cfg={"market_holidays":["2026-10-19"]}\n    assert market_session.next_trading_date(cfg,dt(2026,10,17,10,0))=="2026-10-20"\n''',encoding='utf-8')
      - name: Compile production modules
        run: python -m py_compile app.py worker_base.py market_session.py top5_timeline.py dynamic_opportunity_ui.py premarket_intelligence.py premarket_evaluation.py premarket_explain.py closing_overnight.py ai_stock_ask.py
      - name: Run complete regression suite
        run: python -m pytest -q test_batch1_live_engine.py test_market_session_v1847.py test_premarket_intelligence.py test_premarket_explain.py test_premarket_evaluation.py test_closing_overnight.py test_ai_stock_ask.py
      - name: Production audit
        run: |
          grep -q 'market_session.next_trading_date' worker_base.py
          grep -q 'LEFT JOIN premarket_evaluations' worker_base.py
          grep -q 'INSERT OR IGNORE INTO premarket_evaluations' worker_base.py
          grep -q 'AI Stock Intelligence V1.8.47' app.py
          python - <<'PY'
          import json
          c=json.load(open('config.json',encoding='utf-8'))
          assert c['engine_version']=='1.8.47'
          assert c['production_stabilization_version']=='1.8.47'
          PY
      - name: Commit stabilization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker_base.py app.py test_market_session_v1847.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V1.8.47 stabilize market-date scheduling and evaluation persistence'
          git push

name: V1.8.48 Mobile Charts and Bottom Navigation

'on':
  push:
    paths:
      - '.github/workflows/v1843_integration.yml'

permissions:
  contents: write

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -q pytest pandas numpy requests streamlit altair
      - name: Apply V1.8.48 mobile UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('AI Stock Intelligence V1.8.47','AI Stock Intelligence V1.8.48')

          anchor="    tab_home, tab_premarket, tab_opp, tab_search, tab_history, tab_ai, tab_engine = st.tabs(['🏠 Ringkasan','🌅 Pre-Market','🚀 Opportunity','🔎 Analisis Saham','📚 History & Shadow','🧠 AI & Validasi','⚙️ Engine / Log'])\n"
          mobile="""    # V1.8.48: mobile bottom navigation. Streamlit keeps tab semantics while\n    # Android WebView gets an app-like fixed navigation bar at the bottom.\n    st.markdown('''<style>\n    @media (max-width: 900px) {\n      .stApp { padding-bottom: 86px; }\n      div[data-baseweb=\"tab-list\"] {\n        position: fixed !important; left: 0; right: 0; bottom: 0; z-index: 9999;\n        display: flex !important; justify-content: space-around; gap: 0 !important;\n        background: rgba(14,17,23,.97); border-top: 1px solid rgba(128,128,128,.28);\n        padding: 6px 4px max(8px, env(safe-area-inset-bottom));\n        box-shadow: 0 -5px 20px rgba(0,0,0,.28); overflow-x: auto;\n      }\n      div[data-baseweb=\"tab-list\"] button {\n        min-width: 78px; min-height: 52px; padding: 5px 8px !important;\n        font-size: .76rem !important; line-height: 1.05 !important; white-space: nowrap;\n      }\n      div[data-baseweb=\"tab-highlight\"] { top: 0 !important; bottom: auto !important; }\n    }\n    </style>''', unsafe_allow_html=True)\n\n"""+anchor
          if anchor not in s:
              raise SystemExit('tab anchor not found')
          s=s.replace(anchor,mobile,1)

          ih_anchor="            st.caption('IHSG juga sudah menjadi bagian dari konteks model/opportunity melalui fitur market regime, relative strength, market score, dan alignment yang tersedia pada engine.')\n"
          ih_chart="""            st.markdown('#### 📈 Grafik IHSG')\n            ih_chart_df=fetch_ihsg().copy()\n            if not ih_chart_df.empty:\n                ih_chart_df['date']=pd.to_datetime(ih_chart_df['date'],errors='coerce')\n                ih_chart_df=ih_chart_df.dropna(subset=['date','close']).tail(120)\n                try:\n                    import altair as alt\n                    ih_first=float(ih_chart_df['close'].iloc[0]); ih_last=float(ih_chart_df['close'].iloc[-1])\n                    ih_color='#10b981' if ih_last>=ih_first else '#ef4444'\n                    ih_plot=alt.Chart(ih_chart_df).mark_line(strokeWidth=3,color=ih_color).encode(\n                        x=alt.X('date:T',title=None,axis=alt.Axis(format='%d %b',labelAngle=0,labelOverlap=True)),\n                        y=alt.Y('close:Q',title='IHSG',scale=alt.Scale(zero=False)),\n                        tooltip=[alt.Tooltip('date:T',title='Tanggal',format='%d %b %Y'),alt.Tooltip('close:Q',title='IHSG',format=',.2f')]\n                    ).properties(height=250)\n                    st.altair_chart(ih_plot,use_container_width=True)\n                except Exception:\n                    st.line_chart(ih_chart_df.set_index('date')[['close']],height=250)\n                st.caption('Riwayat IHSG memakai data asli yang tersedia. Titik historis tidak dibuat-buat menjadi data per detik.')\n            else:\n                st.info('Riwayat grafik IHSG belum tersedia.')\n"""+ih_anchor
          if ih_anchor not in s:
              raise SystemExit('IHSG anchor not found')
          s=s.replace(ih_anchor,ih_chart,1)
          p.write_text(s,encoding='utf-8')

          c=Path('config.json')
          import json
          cfg=json.loads(c.read_text(encoding='utf-8'))
          cfg['engine_version']='1.8.48'
          cfg['mobile_ui_version']='1.8.48'
          cfg['chart_ui_version']='1.8.48'
          c.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          Path('test_mobile_ui_v1848.py').write_text('''from pathlib import Path\n\ndef test_mobile_bottom_nav_and_ihsg_chart_present():\n    s=Path("app.py").read_text(encoding="utf-8")\n    assert "position: fixed !important" in s\n    assert "bottom: 0" in s\n    assert "Grafik IHSG" in s\n    assert "ih_chart_df=fetch_ihsg().copy()" in s\n    assert "AI Stock Intelligence V1.8.48" in s\n\ndef test_historical_data_not_fabricated_per_second():\n    s=Path("app.py").read_text(encoding="utf-8")\n    assert "Titik historis tidak dibuat-buat menjadi data per detik" in s\n''',encoding='utf-8')
      - name: Compile
        run: python -m py_compile app.py worker_base.py market_session.py dynamic_opportunity_ui.py ai_stock_ask.py
      - name: Regression tests
        run: python -m pytest -q test_batch1_live_engine.py test_market_session_v1847.py test_premarket_intelligence.py test_premarket_explain.py test_premarket_evaluation.py test_closing_overnight.py test_ai_stock_ask.py test_mobile_ui_v1848.py
      - name: Audit
        run: |
          grep -q 'AI Stock Intelligence V1.8.48' app.py
          grep -q 'Grafik IHSG' app.py
          grep -q 'position: fixed !important' app.py
          python - <<'PY'
          import json
          c=json.load(open('config.json',encoding='utf-8'))
          assert c['engine_version']=='1.8.48'
          assert c['mobile_ui_version']=='1.8.48'
          assert c['chart_ui_version']=='1.8.48'
          PY
      - name: Commit V1.8.48
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py config.json test_mobile_ui_v1848.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V1.8.48 add IHSG chart and mobile bottom navigation'
          git push

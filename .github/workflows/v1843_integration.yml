name: V1.8.43 PreMarket Explain Integration

on:
  push:
    paths:
      - '.github/workflows/v1843_integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install -q pytest pandas
      - name: Wire auditable premarket explanation
        shell: python
        run: |
          from pathlib import Path

          worker = Path('worker_base.py')
          text = worker.read_text(encoding='utf-8')
          if 'import premarket_explain\n' not in text:
              text = text.replace('import premarket_evaluation\n', 'import premarket_evaluation\nimport premarket_explain\n', 1)
          old = '''            reason=f"{str(row.get('decision','WATCH'))} • AI {_pm_num(row.get('ai_score'),0):.1f}"\n'''
          new = '''            reason=premarket_explain.explain_pick(row.to_dict())\n'''
          if old not in text:
              raise SystemExit('premarket reason anchor not found')
          text = text.replace(old, new, 1)
          worker.write_text(text, encoding='utf-8')

          test = Path('test_premarket_explain.py')
          test.write_text('''from premarket_explain import explain_pick\n\n\ndef test_explanation_uses_actual_factors_and_opening_gate():\n    text = explain_pick({\n        "decision": "BUY", "ai_score": 81, "jst_p_up": 0.71,\n        "relative_percentile": 0.94, "risk_reward_2": 2.1,\n        "risk": "MEDIUM", "market_regime": "BULLISH",\n    })\n    assert "SEBAB:" in text\n    assert "AI Score 81.0" in text\n    assert "P(UP) 71.0%" in text\n    assert "relative strength 94.0%" in text\n    assert "R/R 2.10" in text\n    assert "risk MEDIUM" in text\n    assert "IHSG BULLISH" in text\n    assert "AKIBAT: kandidat BUY Pre-Market" in text\n    assert "Opening Confirmation" in text\n\n\ndef test_explanation_does_not_invent_missing_factors():\n    text = explain_pick({"decision": "STRONG_BUY", "ai_score": 75})\n    assert "AI Score 75.0" in text\n    assert "P(UP)" not in text\n    assert "R/R" not in text\n    assert "IHSG" not in text\n''', encoding='utf-8')
      - name: Compile V1.8.43 Python
        run: python -m py_compile worker_base.py premarket_intelligence.py premarket_evaluation.py premarket_explain.py dynamic_opportunity_ui.py app.py
      - name: Run focused tests
        run: python -m pytest -q test_premarket_intelligence.py test_premarket_explain.py test_batch1_live_engine.py
      - name: Commit explanation integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker_base.py test_premarket_explain.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V1.8.43 integrate auditable premarket explanations'
          git push

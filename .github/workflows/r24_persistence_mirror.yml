name: R24 Persistence Exact Mirror
on:
  push:
    branches: [fix-persistence-mirror-r24]
    paths:
      - 'tools/apply_r24_persistence_mirror.py'
      - 'tests/test_persistence_mirror_r24.py'
      - '.github/workflows/r24_persistence_mirror.yml'
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-persistence-mirror-r24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact-mirror patch
        run: python tools/apply_r24_persistence_mirror.py
      - name: Compile changed modules
        run: python -m py_compile persistent_bridge.py runtime_api.py
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: R24 targeted tests
        run: python -m pytest -q tests/test_persistence_mirror_r24.py
      - name: Full regression suite
        run: python -m pytest -q
      - name: Static safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('persistent_bridge.py').read_text(encoding='utf-8')
          a=Path('runtime_api.py').read_text(encoding='utf-8')
          assert 'PERSIST-BRIDGE-R4-EXACT-MIRROR' in p
          assert 'DELETE FROM asi_premarket_picks WHERE market_date=%s' in p
          assert 'remote_final_dates' in p
          assert 'local_run_dates' in p
          assert 'DELETE FROM asi_opportunity_snapshot WHERE singleton=1' in p
          assert 'snapshot_generated_at' in p
          assert p.count('WHERE p.rank BETWEEN 1 AND r.pick_count') >= 1
          assert 'WHERE p.rank BETWEEN 1 AND r.pick_count' in a
          assert 'protected_final_dates' not in p
          print('R24 exact-mirror contract passed')
          PY
      - name: Commit production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add persistent_bridge.py runtime_api.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make persistence control-plane an exact mirror'
          git pull --rebase origin fix-persistence-mirror-r24
          git push origin HEAD:fix-persistence-mirror-r24

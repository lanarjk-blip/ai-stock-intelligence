# trigger-r23-runtime-labels
name: R23 Runtime Labels
on:
  push:
    branches: [fix-actionability-integrity-r23]
    paths:
      - 'tools/apply_r23_runtime_label_patch.py'
      - '.github/workflows/r23_runtime_labels.yml'
permissions:
  contents: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-actionability-integrity-r23
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply label patch
        run: python tools/apply_r23_runtime_label_patch.py
      - name: Compile and assert labels
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          assert "AI Stock Intelligence V1.8.48" not in s
          assert "mobile_ui_version" in s
          assert "expected_fingerprint" in s
          assert "on-open health-gated • H-10 final 08:50 WIB" in s
          print('R23 RUNTIME LABELS PASSED')
          PY
      - name: Full tests
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q
      - name: Commit validated labels
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show config version and runtime fingerprint in UI'
          git pull --rebase origin fix-actionability-integrity-r23
          git push origin HEAD:fix-actionability-integrity-r23

name: R23 Cleanup
on:
  push:
    branches: [fix-actionability-integrity-r23]
    paths:
      - 'tools/r23_cleanup.py'
      - '.github/workflows/r23_cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-actionability-integrity-r23
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply cleanup
        run: python tools/r23_cleanup.py
      - name: Validate cleanup
        run: |
          python -m py_compile recommendation_history.py
          python - <<'PY'
          from pathlib import Path
          s=Path('recommendation_history.py').read_text(encoding='utf-8')
          needle='if "candidate_mode" not in existing:'
          assert s.count(needle)==1, s.count(needle)
          print('R23 CLEANUP CONTRACT PASSED')
          PY
      - name: Run full tests
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recommendation_history.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Clean duplicate candidate-mode migration'
          git pull --rebase origin fix-actionability-integrity-r23
          git push origin HEAD:fix-actionability-integrity-r23

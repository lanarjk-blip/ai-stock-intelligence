name: R29 Live Intraday Freshness
on:
  push:
    branches: [fix-live-intraday-r29]
    paths:
      - 'tools/apply_r29_live_intraday.py'
      - 'tests/test_live_intraday_r29.py'
      - '.github/workflows/r29_live_intraday.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-live-intraday-r29
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply R29 patch
        run: python tools/apply_r29_live_intraday.py
      - name: Compile changed production modules
        run: python -m py_compile worker_base.py dynamic_engine.py
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: R29 targeted tests
        run: python -m pytest -q tests/test_live_intraday_r29.py
      - name: Full regression suite
        run: python -m pytest -q
      - name: Static live-intraday contract
        run: |
          python - <<'PY'
          from pathlib import Path
          w=Path('worker_base.py').read_text(encoding='utf-8')
          d=Path('dynamic_engine.py').read_text(encoding='utf-8')
          c=Path('config.json').read_text(encoding='utf-8')
          assert 'def refresh_intraday_candidates' in w
          assert 'def intraday_refresh_due' in w
          assert 'INTRADAY_REFRESH_START' in w and 'last_intraday_market_date' in w
          assert 'str(source).lower() == "full-universe"' in w
          assert 'def _latest_intraday_live_price' in d
          assert "not bool(ts.get('intraday_fresh'))" in d
          assert "r['close']=float(live_bar['price'])" in d
          assert 'intraday STALE; live action blocked' in d
          assert 'intraday_refresh_period_days' in c
          assert 'intraday_refresh_retry_minutes' in c
          assert 'intraday_live_stale_minutes' in c
          print('R29 live intraday contract OK')
          PY
      - name: Commit production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker_base.py dynamic_engine.py config.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh live intraday evidence for dynamic opportunities'
          git pull --rebase origin fix-live-intraday-r29
          git push origin HEAD:fix-live-intraday-r29

name: V1.8.49 Worker Reliability Patch
on:
  push:
    paths:
      - '.github/workflows/v1849_worker_reliability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-v1849-recover-tuple
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Apply recover tuple hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker_base.py')
          s=p.read_text(encoding='utf-8')
          old='''        if callable(recover):\n            df = recover(\n                ticker,\n                CFG["daily_period_days"],\n                CFG["daily_interval"],\n            )\n        else:'''
          new='''        if callable(recover):\n            recovered = recover(\n                ticker,\n                CFG["daily_period_days"],\n                CFG["daily_interval"],\n            )\n            # fetch_chart_recover returns (dataframe, status, symbol, error).\n            # Keep compatibility if a future implementation returns only a dataframe.\n            df = recovered[0] if isinstance(recovered, tuple) else recovered\n        else:'''
          if old not in s:
              raise SystemExit('fetch_one recover anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Compile
        run: python -m py_compile worker_base.py app.py
      - name: Focused assertions
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('worker_base.py').read_text(encoding='utf-8')
          c=Path('config.json').read_text(encoding='utf-8')
          ast.parse(s)
          assert 'recovered = recover(' in s
          assert 'df = recovered[0] if isinstance(recovered, tuple) else recovered' in s
          assert 'rows = app.save_daily(df, ticker)' in s
          assert '"PRIORITY_SKIP"' in s
          assert 'def cached_ihsg_available():' in s
          assert '"engine_version": "1.8.49"' in c
          print('V1.8.49 tuple hotfix assertions passed')
          PY
      - name: Regression tests
        run: python -m pytest -q test_batch1_live_engine.py test_mobile_ui_v1848.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker_base.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No worker changes to commit'
          else
            git commit -m 'Fix V1.8.49 recover tuple contract'
            git push origin HEAD:fix-v1849-recover-tuple
          fi

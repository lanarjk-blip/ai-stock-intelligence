name: R32 Live Price Coherence
on:
  push:
    branches: [fix-live-price-coherence-r32]
    paths:
      - 'tools/apply_r32_live_price.py'
      - 'tests/test_live_price_coherence_r32.py'
      - '.github/workflows/r32_live_price.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-live-price-coherence-r32
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply R32 patch
        run: python tools/apply_r32_live_price.py
      - name: Compile
        run: python -m py_compile app.py hold_engine.py
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: R32 targeted tests
        env:
          AI_ENGINE_WORKER: '1'
        run: python -m pytest -q tests/test_live_price_coherence_r32.py
      - name: Full regression suite
        env:
          AI_ENGINE_WORKER: '1'
        run: python -m pytest -q
      - name: Static live-price contract
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('hold_engine.py').read_text(encoding='utf-8')
          a=Path('app.py').read_text(encoding='utf-8')
          assert 'def _live_intraday_context' in h
          assert 'DAILY_CLOSE_STALE_INTRADAY' in h
          assert "'current_price':current_price" in h
          assert 'price_source' in h and 'intraday_fresh' in h and 'time_status' in h
          assert 'def resolve_stock_display_price' in a
          assert "'label':'Harga live'" in a
          assert "'label':'Daily close'" in a
          assert "p1.metric('Harga terakhir'" not in a
          print('R32 live price coherence contract OK')
          PY
      - name: Commit production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py hold_engine.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make Hold and analysis prices explicit about live freshness'
          git pull --rebase origin fix-live-price-coherence-r32
          git push origin HEAD:fix-live-price-coherence-r32

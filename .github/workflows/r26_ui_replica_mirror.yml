name: R26 UI Replica Exact Mirror
on:
  push:
    branches: [fix-ui-replica-exact-mirror-r26]
    paths:
      - 'tools/apply_r26_ui_replica_mirror.py'
      - '.github/workflows/r26_ui_replica_mirror.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ui-replica-exact-mirror-r26
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply R26 patch
        run: python tools/apply_r26_ui_replica_mirror.py
      - name: Compile
        run: python -m py_compile ui_replica.py
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: UI replica tests
        run: python -m pytest -q tests/test_ui_replica_v1853.py
      - name: Full production regression subset
        run: >-
          python -m pytest -q
          test_batch1_live_engine.py
          test_mobile_ui_v1848.py
          tests/test_accuracy_guardrails_v1852.py
          tests/test_runtime_consistency_v1852.py
          tests/test_ihsg_failover_v1852.py
          tests/test_runtime_stabilization_v1853.py
          tests/test_ui_replica_v1853.py
          tests/test_market_safety_v1853.py
      - name: Static exact-mirror contract
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('ui_replica.py').read_text(encoding='utf-8')
          assert 'DELETE FROM asi_ui_table_snapshots WHERE table_name=%s' in src
          assert 'DELETE FROM asi_ui_files WHERE file_name=%s' in src
          assert 'incoming_tables' in src and 'incoming_files' in src
          assert 'DELETE FROM "{table}"' in src
          print('R26 exact-mirror contract OK')
          PY
      - name: Commit production patch and regression tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui_replica.py tests/test_ui_replica_v1853.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make UI replica an exact mirror'
          git pull --rebase origin fix-ui-replica-exact-mirror-r26
          git push origin HEAD:fix-ui-replica-exact-mirror-r26

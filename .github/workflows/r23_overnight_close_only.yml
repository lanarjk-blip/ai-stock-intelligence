name: R23 Close-Only Overnight
on:
  push:
    branches: [fix-actionability-integrity-r23]
    paths:
      - 'tools/apply_r23_overnight_close_patch.py'
      - '.github/workflows/r23_overnight_close_only.yml'
permissions:
  contents: write
jobs:
  overnight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-actionability-integrity-r23
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -q -r requirements.txt pytest
      - name: Apply close-only patch
        run: python tools/apply_r23_overnight_close_patch.py
      - name: Compile
        run: python -m py_compile worker_base.py closing_overnight.py
      - name: Verify Overnight immutability during live market
        env:
          AI_ENGINE_WORKER: '0'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import pandas as pd
          import worker_base

          sample=pd.DataFrame([{
              'ticker':'TEST','company':'Test','decision':'BUY','decision_priority':0,
              'decision_score':90,'relative_rank_score':95,'ai_score':90,'jst_p_up':.80,
              'risk_reward_2':2.0,'risk':'LOW','market_regime':'BULLISH','close':100,
              'entry_low':99,'entry_high':101,'stop_loss':95,'target_1':110,'target_2':120
          }])
          worker_base.app.state_set('overnight_picks_json','[{"ticker":"OLD"}]')
          worker_base.app.state_set('overnight_pick_count',1)
          original=worker_base.closing_overnight.select_overnight
          calls=[]
          def tracked(res,cfg):
              calls.append(1)
              return original(res,cfg)
          worker_base.closing_overnight.select_overnight=tracked
          try:
              live=datetime(2026,10,15,10,0,tzinfo=ZoneInfo('Asia/Jakarta'))
              r=worker_base._refresh_closing_overnight(sample,now=live)
              assert r['status']=='PRESERVED',r
              assert calls==[],calls
              assert worker_base.app.state_get('overnight_picks_json')=='[{"ticker":"OLD"}]'
              assert str(worker_base.app.state_get('overnight_refresh_status')).startswith('PRESERVED_')

              lunch=datetime(2026,10,15,12,30,tzinfo=ZoneInfo('Asia/Jakarta'))
              r=worker_base._refresh_closing_overnight(sample,now=lunch)
              assert r['status']=='PRESERVED' and calls==[]

              pre=datetime(2026,10,15,8,0,tzinfo=ZoneInfo('Asia/Jakarta'))
              r=worker_base._refresh_closing_overnight(sample,now=pre)
              assert r['status']=='PRESERVED' and calls==[]

              closed=datetime(2026,10,15,16,5,tzinfo=ZoneInfo('Asia/Jakarta'))
              r=worker_base._refresh_closing_overnight(sample,now=closed)
              assert r['status']=='OVERNIGHT_READY',r
              assert len(calls)==1,calls
              assert r['target_market_date']=='2026-10-16',r
              assert worker_base.app.state_get('overnight_source_market_date')=='2026-10-15'
              assert worker_base.app.state_get('overnight_target_market_date')=='2026-10-16'
              assert worker_base.app.state_get('overnight_refresh_status')=='CLOSING_FINAL'
              assert 'TEST' in worker_base.app.state_get('overnight_picks_json')
          finally:
              worker_base.closing_overnight.select_overnight=original
          print('R23 CLOSE-ONLY OVERNIGHT PASSED')
          PY
      - name: Full tests
        run: python -m pytest -q
      - name: Commit validated overnight change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker_base.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Overnight Intelligence only after market close'
          git pull --rebase origin fix-actionability-integrity-r23
          git push origin HEAD:fix-actionability-integrity-r23

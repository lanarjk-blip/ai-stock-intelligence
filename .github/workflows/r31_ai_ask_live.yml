name: R31 AI Stock Ask Live Safety
on:
  push:
    branches: [fix-ai-ask-live-r31]
    paths:
      - 'ai_stock_ask.py'
      - 'test_ai_stock_ask.py'
      - 'tools/apply_r31_ai_ask_live.py'
      - 'tests/test_ai_ask_live_r31.py'
      - '.github/workflows/r31_ai_ask_live.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ai-ask-live-r31
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply R31 app patch
        run: python tools/apply_r31_ai_ask_live.py
      - name: Compile
        run: python -m py_compile app.py ai_stock_ask.py
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: R31 targeted tests
        env:
          AI_ENGINE_WORKER: '1'
        run: python -m pytest -q tests/test_ai_ask_live_r31.py test_ai_stock_ask.py
      - name: Full regression suite
        env:
          AI_ENGINE_WORKER: '1'
        run: python -m pytest -q
      - name: Static AI Ask contract
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('app.py').read_text(encoding='utf-8')
          q=Path('ai_stock_ask.py').read_text(encoding='utf-8')
          assert 'def build_ai_ask_snapshot' in a
          assert 'LIVE_INTRADAY' in a
          assert 'ask_snapshot=build_ai_ask_snapshot' in a
          assert 'today_entry_ready' in q
          assert 'not live_required or not intraday_fresh' in q
          assert 'opportunity_state == "ENTRY READY"' in q
          print('R31 AI Ask live safety contract OK')
          PY
      - name: Commit production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py ai_stock_ask.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Ground AI Stock Ask TODAY in live Dynamic evidence'
          git pull --rebase origin fix-ai-ask-live-r31
          git push origin HEAD:fix-ai-ask-live-r31

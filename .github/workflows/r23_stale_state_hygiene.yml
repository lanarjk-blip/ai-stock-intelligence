name: R23 Stale State Hygiene
on:
  push:
    branches: [fix-actionability-integrity-r23]
    paths:
      - 'tools/apply_r23_stale_state_patch.py'
      - '.github/workflows/r23_stale_state_hygiene.yml'
permissions:
  contents: write
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-actionability-integrity-r23
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -q -r requirements.txt pytest
      - name: Apply stale-state patch
        run: python tools/apply_r23_stale_state_patch.py
      - name: Compile
        run: python -m py_compile dynamic_engine.py top5_timeline.py hold_engine.py worker_base.py
      - name: Verify stale-state behavior
        env:
          AI_ENGINE_WORKER: '0'
        run: |
          python - <<'PY'
          import ast, json, os, sqlite3, tempfile
          from pathlib import Path
          import pandas as pd

          import app
          import dynamic_engine
          import hold_engine
          import top5_timeline

          td=tempfile.mkdtemp(prefix='asi-r23-stale-')
          db=os.path.join(td,'market.db')
          app.DB=db; app.DB_DIR=td
          app.init_db(); dynamic_engine.ensure_tables(); hold_engine.ensure_tables(); top5_timeline.ensure_tables(db)

          # Dynamic empty result must remove stale visible rows and pool rows.
          con=sqlite3.connect(db)
          con.execute("INSERT INTO dynamic_opportunities(ticker,rank) VALUES('OLD',1)")
          con.execute("INSERT INTO dynamic_opportunity_pool(ticker,rank) VALUES('OLD',1)")
          con.commit(); con.close()
          out=dynamic_engine.update(pd.DataFrame(),phase='TEST')
          assert out.empty
          con=sqlite3.connect(db)
          assert con.execute('SELECT COUNT(*) FROM dynamic_opportunities').fetchone()[0]==0
          assert con.execute('SELECT COUNT(*) FROM dynamic_opportunity_pool').fetchone()[0]==0
          con.close()
          assert app.state_get('dynamic_candidate_mode')=='NO_DATA'

          # All sell aliases are true exclusions, not fallback monitor candidates.
          sell=pd.DataFrame([
              {'ticker':d,'company':d,'decision':d,'decision_reason':'x','ai_score':99,'relative_percentile':.99,
               'relative_rank_score':99,'close':100,'entry_low':99,'entry_high':101,'stop_loss':95,
               'target_1':110,'target_2':120,'risk_reward_2':2,'risk':'LOW','jst_p_up':.9,'jst_p_down':.05,
               'jst_confidence':.9,'market_regime':'BULLISH','market_score':70}
              for d in ['SELL','SELL/AVOID','AVOID','STRONG_SELL','EXIT']
          ])
          assert dynamic_engine.update(sell,phase='TEST').empty
          assert app.state_get('dynamic_candidate_mode')=='NO_TRADE'

          # Hold empty/no-candidate cycles must delete stale Hold rows.
          con=sqlite3.connect(db)
          con.execute("INSERT INTO hold_intelligence(ticker) VALUES('OLDH')")
          con.commit(); con.close()
          assert hold_engine.update(pd.DataFrame(),phase='CLOSED').empty
          con=sqlite3.connect(db)
          assert con.execute('SELECT COUNT(*) FROM hold_intelligence').fetchone()[0]==0
          con.close()
          assert app.state_get('hold_intelligence_status')=='NO_DATA'

          # Empty Top5 must clear baseline/actionable state and cancel stale pending notifications.
          con=sqlite3.connect(db)
          con.execute("INSERT OR REPLACE INTO top5_live_state(singleton,updated_at,tickers_json) VALUES(1,'x',?)",(json.dumps(['OLD']),))
          con.execute("INSERT OR REPLACE INTO live_action_state(ticker,updated_at,state,entry_status,is_entry_ready) VALUES('OLD','x','ENTRY READY','ACTIVE',1)")
          con.execute("INSERT INTO top5_timeline(event_at_utc,event_at_wib,event_type,ticker,old_top5_json,new_top5_json,reason,notification_status) VALUES('x','x','ENTRY_READY','OLD',?,?,?,'PENDING')",(json.dumps(['OLD']),json.dumps(['OLD']),'x'))
          con.commit(); con.close()
          result=top5_timeline.record_top5(db,pd.DataFrame(),source_phase='full-universe',config={})
          assert result['status']=='CLEARED_EMPTY', result
          con=sqlite3.connect(db)
          baseline=json.loads(con.execute('SELECT tickers_json FROM top5_live_state WHERE singleton=1').fetchone()[0])
          live=con.execute("SELECT state,entry_status,is_entry_ready FROM live_action_state WHERE ticker='OLD'").fetchone()
          note=con.execute("SELECT notification_status FROM top5_timeline WHERE ticker='OLD' ORDER BY id DESC LIMIT 1").fetchone()[0]
          con.close()
          assert baseline==[]
          assert live==('INACTIVE','EMPTY',0), live
          assert note=='CANCELLED_STALE', note

          # Worker contract: legacy Pre-Market writer is never called; compatibility shim is inert.
          worker=Path('worker_base.py').read_text(encoding='utf-8')
          tree=ast.parse(worker)
          calls=[n for n in ast.walk(tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=='lock_premarket_picks']
          assert not calls
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='lock_premarket_picks')
          assert isinstance(fn.body[1] if ast.get_docstring(fn) else fn.body[0],ast.Return)
          assert "r.note LIKE 'H10_FINAL%'" in worker
          assert 'dynamic_ok = False' in worker and 'and dynamic_ok' in worker

          # No audit duplication remains.
          de=Path('dynamic_engine.py').read_text(encoding='utf-8')
          assert de.count("app.state_set('opening_confirmation_status','READY')")==1
          t5=Path('top5_timeline.py').read_text(encoding='utf-8')
          marker="actionable_tickers = set()"
          assert t5.count(marker)==1, t5.count(marker)
          print('R23 STALE-STATE HYGIENE PASSED')
          PY
      - name: Full tests
        run: python -m pytest -q
      - name: Commit validated hygiene
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dynamic_engine.py top5_timeline.py hold_engine.py worker_base.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Clear stale market state and enforce H10 writer ownership'
          git pull --rebase origin fix-actionability-integrity-r23
          git push origin HEAD:fix-actionability-integrity-r23

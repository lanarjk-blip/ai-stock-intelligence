name: R23 Supervisor Takeover
on:
  push:
    branches: [fix-actionability-integrity-r23]
    paths:
      - 'tools/apply_r23_supervisor_takeover_patch.py'
      - '.github/workflows/r23_supervisor_takeover.yml'
permissions:
  contents: write
jobs:
  supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-actionability-integrity-r23
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -q -r requirements.txt pytest
      - name: Apply supervisor patch
        run: python tools/apply_r23_supervisor_takeover_patch.py
      - name: Compile
        run: python -m py_compile runtime_supervisor.py local_runtime_health.py sitecustomize.py
      - name: Verify takeover contract and fingerprint coverage
        env:
          AI_ENGINE_WORKER: '0'
        run: |
          python - <<'PY'
          import os, tempfile
          from pathlib import Path
          import runtime_supervisor as rs
          import local_runtime_health as lrh

          critical={
              'top5_timeline.py','recommendation_history.py','hold_engine.py','ai_stock_ask.py',
              'closing_overnight.py','premarket_evaluation.py','premarket_intelligence.py','fcm_adapter.py'
          }
          assert critical.issubset(set(lrh.FILES)), critical-set(lrh.FILES)
          site=Path('sitecustomize.py').read_text(encoding='utf-8')
          for name in critical:
              assert f'"{name}"' in site, name
          assert 'with open(path, "rb") as fh' in site
          assert 'stat.st_mtime_ns' not in site

          old_checker=rs._pid_is_verified_worker
          old_fp=rs.SOURCE_FINGERPRINT
          try:
              rs._pid_is_verified_worker=lambda pid: int(pid)==123
              rs.SOURCE_FINGERPRINT='NEWFP'
              assert rs._should_takeover({'pid':123,'fingerprint':'OLDFP'}) is True
              assert rs._should_takeover({'pid':123,'fingerprint':''}) is True
              assert rs._should_takeover({'pid':123,'fingerprint':'NEWFP'}) is False
              assert rs._should_takeover({'pid':999,'fingerprint':'OLDFP'}) is False
          finally:
              rs._pid_is_verified_worker=old_checker
              rs.SOURCE_FINGERPRINT=old_fp

          sup=Path('runtime_supervisor.py').read_text(encoding='utf-8')
          assert 'TAKEOVER stale_pid=' in sup
          assert 'fingerprint={SOURCE_FINGERPRINT}' in sup
          assert 'SIGKILL' in sup and '_pid_is_verified_worker' in sup

          # local fingerprint must depend on file content, not timestamp metadata.
          td=tempfile.mkdtemp(prefix='asi-fp-')
          Path(td,'x.py').write_text('alpha',encoding='utf-8')
          old_base,old_files=lrh.BASE,lrh.FILES
          try:
              lrh.BASE=td; lrh.FILES=('x.py',)
              a=lrh.source_fingerprint()
              Path(td,'x.py').write_text('bravo',encoding='utf-8')
              b=lrh.source_fingerprint()
              assert a!=b,(a,b)
          finally:
              lrh.BASE,lrh.FILES=old_base,old_files
          print('R23 SUPERVISOR TAKEOVER CONTRACT PASSED')
          PY
      - name: Full tests
        run: python -m pytest -q
      - name: Commit validated supervisor changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime_supervisor.py local_runtime_health.py sitecustomize.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Replace stale workers across deploys using source fingerprints'
          git pull --rebase origin fix-actionability-integrity-r23
          git push origin HEAD:fix-actionability-integrity-r23

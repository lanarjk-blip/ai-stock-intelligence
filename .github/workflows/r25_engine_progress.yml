name: R25 Engine Progress Guard
on:
  push:
    branches: [fix-engine-progress-r25]
    paths:
      - 'tools/apply_r25_engine_progress.py'
      - 'tests/test_engine_progress_r25.py'
      - '.github/workflows/r25_engine_progress.yml'
permissions:
  contents: write
jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-engine-progress-r25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply R25 patch
        run: python tools/apply_r25_engine_progress.py
      - name: Compile changed production modules
        run: >-
          python -m py_compile worker_base.py local_runtime_health.py runtime_health.py
          persistent_bridge.py sitecustomize.py runtime_health_ui_patch.py
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: R25 targeted behavior tests
        run: python -m pytest -q tests/test_engine_progress_r25.py
      - name: Full regression suite
        run: python -m pytest -q
      - name: Static R25 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config.json').read_text(encoding='utf-8'))
          worker=Path('worker_base.py').read_text(encoding='utf-8')
          local=Path('local_runtime_health.py').read_text(encoding='utf-8')
          remote=Path('runtime_health.py').read_text(encoding='utf-8')
          bridge=Path('persistent_bridge.py').read_text(encoding='utf-8')
          site=Path('sitecustomize.py').read_text(encoding='utf-8')
          assert cfg['engine_progress_max_age_seconds']==1200
          assert cfg['engine_result_max_age_minutes']==90
          assert 'def mark_engine_progress' in worker and 'COLLECT_PROGRESS' in worker
          assert 'engine_cycle_status' in worker and 'CYCLE_ERROR' in worker
          assert 'def engine_progress_health' in local
          assert 'ENGINE_STALLED' in local and 'ENGINE_WARMING' in local
          assert 'engine_progress_at' in remote and 'engine_progress_health' in remote
          assert 'def _remove_sqlite_sidecars' in bridge
          assert '_remove_sqlite_sidecars(LOCAL_DB)' in bridge
          assert 'post-restore heartbeat error' in site
          print('R25 progress/restore contract passed')
          PY
      - name: Commit production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config.json worker_base.py local_runtime_health.py runtime_health.py persistent_bridge.py sitecustomize.py runtime_health_ui_patch.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Guard actionable UI on engine progress freshness'
          git pull --rebase origin fix-engine-progress-r25
          git push origin HEAD:fix-engine-progress-r25

name: R23 Final Read-Only Gate
on:
  push:
    branches: [fix-actionability-integrity-r23]
    paths:
      - '.github/workflows/r23_final_gate.yml'
permissions:
  contents: read
jobs:
  final-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-actionability-integrity-r23
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Diff hygiene
        run: git diff --check
      - name: Compile production modules
        run: >-
          python -m py_compile app.py worker_base.py accuracy_guardrails.py
          dynamic_engine.py dynamic_opportunity_ui.py recommendation_history.py
          top5_timeline.py hold_engine.py ai_stock_ask.py market_session.py
          premarket_scheduler.py premarket_preliminary.py premarket_ui_patch.py
          runtime_supervisor.py runtime_health.py runtime_health_ui_patch.py
          local_runtime_health.py persistent_bridge.py ui_replica.py
          replica_runtime.py external_runtime_guard.py runtime_api.py sitecustomize.py
      - name: Assert R23 production contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.py').read_text(encoding='utf-8')
          dyn=Path('dynamic_engine.py').read_text(encoding='utf-8')
          hist=Path('recommendation_history.py').read_text(encoding='utf-8')
          top=Path('top5_timeline.py').read_text(encoding='utf-8')
          h10=Path('premarket_scheduler.py').read_text(encoding='utf-8')
          prelim=Path('premarket_preliminary.py').read_text(encoding='utf-8')
          health=Path('local_runtime_health.py').read_text(encoding='utf-8')
          sup=Path('runtime_supervisor.py').read_text(encoding='utf-8')
          ask=Path('ai_stock_ask.py').read_text(encoding='utf-8')
          hold=Path('hold_engine.py').read_text(encoding='utf-8')

          assert 'AI Stock Intelligence V1.8.48' not in app
          assert 'mobile_ui_version' in app and 'expected_fingerprint' in app
          compact=dyn.replace(' ', '')
          assert 'candidate_modeTEXT' in compact
          assert "mode=='MONITOR_FALLBACK':return'MONITOR'" in compact
          assert 'reference_price REAL' in h10 and '_sanitize_payload_for_quality' in h10
          assert 'QUALITY_MONITOR' in h10 and 'reference_price' in prelim
          assert hist.count('if "candidate_mode" not in existing:') == 1
          assert 'candidate_mode != "MONITOR_FALLBACK"' in hist
          assert 'MONITOR_FALLBACK' in top and 'MONITOR_FALLBACK' in ask
          assert '_clear_current' in hold
          for required in ('recommendation_history.py','top5_timeline.py','hold_engine.py','ai_stock_ask.py','config.json'):
              assert required in health, required
          assert 'fingerprint=' in sup and 'TAKEOVER' in sup and 'SIGKILL' in sup
          print('R23 STATIC CONTRACTS PASSED')
          PY
      - name: Full behavior and regression suite
        run: python -m pytest -q
      - name: Ensure gate did not mutate tracked source
        run: git diff --exit-code

name: Android APK Build

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - 'config.json'
      - '.github/workflows/android_apk.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - 'config.json'
      - '.github/workflows/android_apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('config.json').read_text())['mobile_ui_version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: test -f android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk "AI-Stock-Intelligence-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Stock-Intelligence-${{ steps.version.outputs.version }}
          path: AI-Stock-Intelligence-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

name: Android APK Build

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android_apk.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android_apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: test -f android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk AI-Stock-Intelligence-1.8.54.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Stock-Intelligence-1.8.54
          path: AI-Stock-Intelligence-1.8.54.apk
          if-no-files-found: error
          retention-days: 30

name: Patch On-Open Pre-Market Recovery
on:
  push:
    branches: [backend-persistent-runtime]
    paths:
      - '.github/workflows/app_onopen_premarket_patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend-persistent-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch app on-open recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old="""def render_premarket_panel():\n    run=read_premarket_run()\n    st.subheader('🌅 Pre-Market Top Picks')"""
          new="""def _ensure_premarket_on_open():\n    \"\"\"Best-effort UI recovery when background Pre-Market daemons are late/dead.\n\n    This deliberately runs only from the UI process. It reuses the same\n    premarket_preliminary selection path and therefore cannot fabricate BUY\n    signals. H10_FINAL remains immutable inside that module.\n    \"\"\"\n    try:\n        import premarket_preliminary\n        result=premarket_preliminary.publish_preliminary() or {}\n        state_set('premarket_on_open_status',str(result.get('status','UNKNOWN')))\n        state_set('premarket_on_open_at',datetime.now(timezone.utc).isoformat())\n        return result\n    except Exception as exc:\n        state_set('premarket_on_open_status','ERROR')\n        state_set('premarket_on_open_error',str(exc)[:500])\n        return {'status':'ERROR','error':str(exc)}\n\n\ndef render_premarket_panel():\n    recovery=_ensure_premarket_on_open()\n    run=read_premarket_run()\n    st.subheader('🌅 Pre-Market Top Picks')\n    st.caption('Runtime recovery R22 • on-open preliminary aktif • H-10 final 08:50 WIB')"""
          if old not in s:
              raise SystemExit('render_premarket_panel anchor not found')
          s=s.replace(old,new,1)
          old_empty="""    if not run:\n        st.info('Pre-Market belum memiliki locked run. Worker akan membuatnya setelah full-universe cycle.')\n        return"""
          new_empty="""    if not run:\n        recovery_status=str((recovery or {}).get('status','UNKNOWN')).upper()\n        st.warning(\n            f'Pre-Market belum punya kandidat tersimpan. On-open recovery: {recovery_status}. ' \
            'Sistem tidak akan menampilkan BUY palsu; jika snapshot Opportunity belum siap, status ini akan tetap kosong sampai data tersedia.'\n        )\n        return"""
          if old_empty not in s:
              raise SystemExit('empty-state anchor not found')
          s=s.replace(old_empty,new_empty,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate patch
        run: |
          python -m py_compile app.py premarket_preliminary.py premarket_scheduler.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          assert 'def _ensure_premarket_on_open():' in s
          assert 'premarket_preliminary.publish_preliminary()' in s
          assert 'Runtime recovery R22' in s
          assert "state_set('premarket_on_open_status'" in s
          print('on-open premarket recovery patch OK')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          git diff --cached --check
          git commit -m 'Guarantee Pre-Market recovery when app opens'
          git push origin HEAD:backend-persistent-runtime
